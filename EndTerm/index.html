<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget Tracker</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="budget.js" defer></script>
</head>
<body>
    <header>
        <h1 class="app-title">💰 Budget Tracker</h1>
    </header>
    <div class="dashboard">
        <div class="left-panel">
            <div class="summary-container">
                <div class="expense-summary">
                    <h2>Expense Summary</h2>
                    <canvas id="expense-chart"></canvas>
                    <ul>
                        <li><span class="color-indicator food"></span> Food: $<span id="food-total">100.00</span></li>
                        <li><span class="color-indicator entertainment"></span> Entertainment: $<span id="entertainment-total">0.00</span></li>
                        <li><span class="color-indicator education"></span> Education: $<span id="education-total">0.00</span></li>
                    </ul>
                </div>

                <div class="vertical-divider"></div>

                <div class="budget-status">
                    <h2>Budget Status</h2>
                    <div class="status-details">
                        <p>💰 Total Income: $<span id="income-total">100000.00</span></p>
                        <p>💸 Total Spent: $<span id="spent-total">100.00</span></p>
                        <p>🔖 Remaining: $<span id="remaining-total">99900.00</span></p>
                    </div>
                    <canvas id="budget-chart"></canvas>
                </div>
            </div>

            <div class="recent-transactions">
                <h2>Recent Transactions</h2>
                <table class="transactions-table">
                    <thead>
                        <tr>
                            <th>Type</th>
                            <th>Amount</th>
                            <th>Category</th>
                            <th>Date</th>
                            <th>Comment</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="transactions-list">
                    </tbody>
                </table>
            </div>
        </div>

        <div class="right-panel">
            <div class="form-section">
                <h2>Add Income</h2>
                <form id="income-form">
                    <label for="income-amount">Amount:</label>
                    <input type="number" id="income-amount" placeholder="Enter income amount" required>
                    <label for="income-comment">Comment:</label>
                    <input type="text" id="income-comment" placeholder="Enter comment">
                    <button type="submit">Add Income</button>
                </form>
            </div>

            <div class="form-section">
                <h2>Add Expense</h2>
                <form id="expense-form">
                    <label for="expense-category">Category:</label>
                    <select id="expense-category" required>
                        <option value="Food">Food</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Education">Education</option>
                    </select>
                    <label for="expense-amount">Amount:</label>
                    <input type="number" id="expense-amount" placeholder="Enter expense amount" required>
                    <label for="expense-comment">Comment:</label>
                    <input type="text" id="expense-comment" placeholder="Enter comment">
                    <button type="submit">Add Expense</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
